name: Build Kernel+DTB rk3399pro-firefly-aioc
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu device-tree-compiler flex bison libssl-dev libelf-dev

      - name: Fetch upstream unifreq PR#36 patch
        run: |
          set +e
          # 添加上游仓库 remote
          git remote add upstream https://github.com/unifreq/linux-6.18.y.git
          git fetch upstream pull/36/head:pr36
          if [ $? -eq 0 ];then
            git merge pr36
            echo "✅ PR#36 merged successfully"
          else
            echo "⚠️ PR#36 not found / already merged, skip merge"
          fi
          git diff arch/arm64/boot/dts/rockchip/rk3399pro-firefly-aioc.dts
        shell: bash

      - name: Generate rockchip defconfig
        run: |
          set -e
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- rockchip_defconfig
          # 开启USB TypeC相关驱动
          sed -i 's/# CONFIG_TYPEC_FUSB302 is not set/CONFIG_TYPEC_FUSB302=y/' .config
          sed -i 's/# CONFIG_USB_DWC3 is not set/CONFIG_USB_DWC3=y/' .config
          sed -i 's/# CONFIG_USB_ROLE_SWITCH is not set/CONFIG_USB_ROLE_SWITCH=y/' .config

      - name: Build Image + target dtb
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) Image
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- arch/arm64/boot/dts/rockchip/rk3399pro-firefly-aioc.dtb

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-rk3399pro-aio3399c
          path: |
            arch/arm64/boot/Image
            arch/arm64/boot/dts/rockchip/rk3399pro-firefly-aioc.dtb
