name: Build rk3399pro-firefly-aioc DTB
on:
  push:
    branches: [ main ]
  workflow_dispatch: # 手动触发，网页点Run workflow

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout linux-6.18.y
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y aarch64-linux-gnu-gcc device-tree-compiler flex bison

      - name: Fetch & merge PR #36
        run: |
          git fetch origin pull/36/head:pr36
          git merge pr36
          # 校验dts是否打上补丁
          git diff arch/arm64/boot/dts/rockchip/rk3399pro-firefly-aioc.dts

      - name: Generate rockchip defconfig
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- rockchip_defconfig

      - name: Compile only target dtb
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            arch/arm64/boot/dts/rockchip/rk3399pro-firefly-aioc.dtb -j$(nproc)

      - name: Upload DTB artifact
        uses: actions/upload-artifact@v4
        with:
          name: rk3399pro-firefly-aioc-dtb
          path: arch/arm64/boot/dts/rockchip/rk3399pro-firefly-aioc.dtb
