name: Build Kernel RK3399Pro AIO-3399ProC
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout target commit
        run: |
          git checkout 5590f194896d493e8835702eb6c3e88d276d210b

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential gcc-aarch64-linux-gnu bison flex libssl-dev libelf-dev bc device-tree-compiler

      - name: Kernel config rockchip64_defconfig
        run: |
          # unifreq仓库的rockchip64_defconfig在config文件夹，复制到内核config路径
          cp config/rockchip64_defconfig arch/arm64/configs/
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- rockchip64_defconfig

      - name: Build Image + modules + single target DTB
        run: |
          make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- Image modules
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- arch/arm64/boot/dts/rockchip/rk3399pro-firefly-aioc.dtb
          ls -lh arch/arm64/boot/dts/rockchip/rk3399pro-firefly-aioc.dtb

      - name: Make deb packages (modules + headers)
        run: |
          make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- bindeb-pkg

      - name: Collect artifacts
        run: |
          mkdir -p output
          cp arch/arm64/boot/Image output/
          cp arch/arm64/boot/dts/rockchip/rk3399pro-firefly-aioc.dtb output/
          cp ../*.deb output/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-rk3399pro-aio3399proc
          path: output/
